<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>개인정보 수집 — 법 제15조제1항 (제2~7호) · 프라이버시 디펜더</title>
<style>
  :root{ --ink:#152029; --mut:#51616e; --line:#d9e2ea; --surface:#fff; --s2:#f1f6f9;
         --teal:#0d7a6e; --teal2:#0a5f56; --red:#c4321b; --org:#c9631a; --purple:#7c3aed; --blue:#2563eb;
         --mono:"JetBrains Mono","Noto Sans Mono CJK KR",monospace; }
  @media(prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --ink:#e6eef3; --mut:#9fb0bd; --line:#2a3842; --surface:#141c22; --s2:#1b252d; } }
  :root[data-theme="dark"]{ --ink:#e6eef3; --mut:#9fb0bd; --line:#2a3842; --surface:#141c22; --s2:#1b252d; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--s2); color:var(--ink); font-family:"IBM Plex Sans KR","Noto Sans KR",sans-serif; line-height:1.6; }
  .wrap{ max-width:860px; margin:0 auto; padding:20px 16px 70px; }
  h1{ font-size:22px; margin:8px 0 2px; } .sub{ color:var(--mut); font-size:14px; margin:0 0 14px; }
  .card{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px 18px; margin:14px 0; }
  .card h2{ font-size:16px; margin:0 0 8px; color:var(--teal2); }
  .themebtn{ position:fixed; right:14px; top:14px; border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:8px; width:34px; height:34px; cursor:pointer; z-index:5; }
  @keyframes blink{ 50%{ opacity:.3; } }
  @keyframes shake{ 0%,100%{ transform:rotate(0);} 25%{ transform:rotate(-12deg);} 75%{ transform:rotate(12deg);} }
  @keyframes pop{ to{ opacity:1; transform:none; } }
  /* 모션 씬: 수집 요청서 심사 */
  .scene{ position:relative; height:150px; border-radius:12px; overflow:hidden; margin:8px 0 14px; background:linear-gradient(180deg,#132a52,#19324a 70%,#17322a); }
  .doc{ position:absolute; left:26px; top:22px; width:120px; height:110px; background:#f4f8fb; border-radius:6px; padding:12px 10px; box-shadow:0 6px 18px rgba(0,0,0,.3); }
  .doc .l{ height:7px; background:#cfdbe6; border-radius:3px; margin-bottom:7px; } .doc .l.s{ width:60%; } .doc .l.t{ width:80%; }
  .doc .hl{ background:#ffe08a; animation:hl 2.4s ease-in-out infinite; } @keyframes hl{ 0%,100%{ background:#cfdbe6;} 50%{ background:#ffd36b;} }
  .mag{ position:absolute; left:120px; top:70px; font-size:30px; animation:scan 3s ease-in-out infinite; } @keyframes scan{ 0%,100%{ transform:translate(0,0);} 50%{ transform:translate(-30px,-26px);} }
  .scale{ position:absolute; right:30px; top:30px; font-size:40px; animation:tip 2.6s ease-in-out infinite; transform-origin:50% 20%; } @keyframes tip{ 0%,100%{ transform:rotate(-7deg);} 50%{ transform:rotate(7deg);} }
  .stamp{ position:absolute; right:40px; bottom:16px; font-family:var(--mono); font-weight:800; color:#1d8f5b; border:3px solid #1d8f5b; border-radius:8px; padding:3px 10px; font-size:14px; transform:rotate(-8deg); opacity:0; animation:stamp 3s ease-in-out infinite; } @keyframes stamp{ 0%,55%{ opacity:0; transform:rotate(-8deg) scale(1.4);} 65%,100%{ opacity:1; transform:rotate(-8deg) scale(1);} }
  .scene .live{ position:absolute; left:12px; bottom:10px; font-size:11px; color:#ff9b8c; font-weight:800; animation:blink 1s steps(2) infinite; }
  /* 대화 */
  .chat{ display:flex; flex-direction:column; gap:9px; min-height:50px; }
  .bubble{ max-width:86%; padding:9px 12px; border-radius:14px; font-size:13.5px; line-height:1.55; display:flex; gap:8px; align-items:flex-start; opacity:0; transform:translateY(8px); animation:pop .35s ease forwards; }
  .bubble .av{ font-size:20px; flex:none; }
  .bubble.mentor{ align-self:flex-start; background:color-mix(in srgb,var(--teal) 12%,var(--surface)); border:1px solid #b9ddd6; border-bottom-left-radius:4px; }
  .bubble.rookie{ align-self:flex-end; flex-direction:row-reverse; background:var(--s2); border:1px solid var(--line); border-bottom-right-radius:4px; text-align:right; }
  .ctl{ display:flex; gap:8px; margin-top:10px; }
  /* 탭 */
  .tabs{ display:flex; gap:6px; flex-wrap:wrap; margin:4px 0 2px; }
  .tab{ border:1px solid var(--line); background:var(--s2); color:var(--ink); border-radius:9px; padding:7px 11px; font-size:13px; font-weight:600; cursor:pointer; display:flex; gap:6px; align-items:center; }
  .tab.on{ background:var(--teal); border-color:var(--teal); color:#fff; }
  .tab .d{ font-size:10.5px; padding:0 6px; border-radius:10px; font-weight:800; }
  .d.ha{ background:#1d8f5b; color:#fff; } .d.jung{ background:#d9731f; color:#fff; } .d.sang{ background:#c4321b; color:#fff; }
  .tab.done::after{ content:"✓"; color:#1d8f5b; font-weight:800; }
  /* 문제 */
  .scenario{ background:var(--s2); border-left:4px solid var(--blue); border-radius:9px; padding:11px 13px; font-size:14px; margin:6px 0 12px; }
  .scenario b{ color:var(--blue); }
  .q{ font-size:15px; font-weight:600; margin:8px 0; }
  .opts{ display:flex; flex-direction:column; gap:7px; }
  .opt{ text-align:left; background:var(--s2); border:1.5px solid var(--line); border-radius:10px; padding:10px 12px; cursor:pointer; font-size:14px; color:var(--ink); }
  .opt:hover{ border-color:var(--teal); } .opt.sel{ border-color:var(--teal); background:color-mix(in srgb,var(--teal) 10%,var(--surface)); }
  .btn{ border:1px solid var(--line); background:var(--s2); color:var(--ink); border-radius:9px; padding:8px 13px; font-size:13.5px; font-weight:600; cursor:pointer; }
  .btn.p{ background:var(--teal); border-color:var(--teal); color:#fff; } .btn.p:hover{ background:var(--teal2); }
  .hintbtns{ display:flex; gap:7px; flex-wrap:wrap; margin:10px 0 0; }
  .hb{ border:1px dashed var(--line); background:transparent; color:var(--mut); border-radius:20px; padding:5px 11px; font-size:12px; cursor:pointer; }
  .hb.used{ border-style:solid; border-color:var(--org); color:var(--org); }
  .hintout{ margin-top:8px; background:color-mix(in srgb,var(--org) 8%,var(--surface)); border:1px solid #e9c89f; border-radius:9px; padding:8px 11px; font-size:13px; display:none; } .hintout b{ color:var(--org); }
  .verdict{ margin-top:12px; border-radius:10px; padding:11px 13px; font-size:14px; display:none; }
  .verdict.bad{ display:block; background:color-mix(in srgb,var(--red) 8%,var(--surface)); border:1px solid #e6b3a8; } .verdict.bad b{ color:var(--red); }
  .verdict.good{ display:block; background:color-mix(in srgb,#1d8f5b 8%,var(--surface)); border:1px solid #a9d8c0; }
  .flag{ font-family:var(--mono); color:var(--teal2); font-weight:700; }
  .sol{ display:none; margin-top:12px; } .sol.show{ display:block; }
  .blk{ background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--teal); border-radius:10px; padding:11px 13px; margin:9px 0; }
  .blk.red{ border-left-color:var(--red); } .blk.red h3{ color:var(--red); } .blk.org{ border-left-color:var(--org); } .blk.org h3{ color:var(--org); } .blk.pur{ border-left-color:var(--purple); } .blk.pur h3{ color:var(--purple); }
  .blk h3{ font-size:14px; margin:0 0 5px; color:var(--teal2); }
  .blk p,.blk li{ font-size:13.5px; } .blk ul,.blk ol{ margin:4px 0; padding-left:19px; }
  .lawbox{ font-family:var(--mono); font-size:12.5px; background:#0f1720; color:#cfe; border-radius:8px; padding:10px 12px; line-height:1.6; white-space:pre-wrap; }
  .lawbox .h{ color:#ffd36b; } .lawbox .em{ color:#7fd1c0; font-weight:700; }
  table{ width:100%; border-collapse:collapse; font-size:12.5px; margin-top:5px; } th,td{ border:1px solid var(--line); padding:6px 8px; text-align:left; vertical-align:top; } th{ background:var(--s2); color:var(--mut); }
  @media(prefers-reduced-motion:reduce){ .doc .hl,.mag,.scale,.stamp,.scene .live,.bubble{ animation:none; opacity:1; transform:none; } }
</style>
</head>
<body>
<button class="themebtn" id="theme" aria-label="테마">🌓</button>
<div class="wrap">
  <h1>개인정보 수집의 적법 근거 — 법 제15조제1항</h1>
  <p class="sub">프라이버시 디펜더 · 법령 조항(호) 기반 세트 · <b>제2호~제7호 각 1문제</b> (동의=제1호 제외)</p>

  <div class="card briefing">
    <h2>📝 사건 브리핑 <span style="color:var(--red);font-size:11px;font-weight:800">● LIVE</span></h2>
    <div class="scene" role="img" aria-label="수집 요청서를 법령 근거로 심사하는 모션">
      <div class="doc"><div class="l t"></div><div class="l s hl"></div><div class="l"></div><div class="l s"></div><div class="l t"></div></div>
      <span class="mag">🔍</span>
      <span class="scale">⚖️</span>
      <span class="stamp">근거 확인</span>
      <span class="live">근거 심사 중…</span>
    </div>
    <div class="chat" id="chat"></div>
    <div class="ctl"><button class="btn" id="next">▶ 다음 대화</button><button class="btn p" id="start" style="display:none">🧩 문제 풀기</button></div>
    <div style="margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);color:var(--mut);font-size:13px">
      개인정보는 함부로 못 모아요. 법 <b>제15조제1항</b>은 모을 수 있는 경우를 <b>호(號)</b>로 정해 뒀어요. 제1호(동의)를 뺀 <b>제2호~제7호</b>, 각 상황이 어느 호에 해당하는지 찾으면 ‘적법 근거’를 익히게 됩니다.
    </div>
  </div>

  <div class="card" id="quiz" style="display:none">
    <div class="tabs" id="tabs"></div>
    <div id="prob"></div>
  </div>
</div>

<script>
(function(){
  var reduce=false; try{ reduce=matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}
  // 대화
  var DIALOG=[
    {w:'rookie',a:'👩‍💼',t:'간세다리님, 민원 서식마다 받는 항목이 다 달라요. 아무거나 받아도 되나요?'},
    {w:'mentor',a:'🧚',t:'아니! 개인정보는 <b>‘모을 수 있는 경우’</b>가 법으로 정해져 있어. 법 <b>제15조제1항</b>이 그 목록이야.'},
    {w:'mentor',a:'🧚',t:'제1호는 <b>동의</b>를 받은 경우고, 제2호~제7호는 동의 없이도 모을 수 있는 특별한 경우들이지.'},
    {w:'rookie',a:'👩‍💼',t:'그럼 상황마다 ‘몇 호에 해당하는지’ 찾으면 되는 거네요?'},
    {w:'mentor',a:'🧚',t:'맞아! 지금부터 6개 상황이 <b>제2~7호</b> 중 어디에 해당하는지 탐정처럼 찾아보자. 난이도 하·중·상이 섞여 있어!'}
  ];
  var di=0, chat=document.getElementById('chat');
  function line(){ if(di>=DIALOG.length)return; var d=DIALOG[di++]; var e=document.createElement('div'); e.className='bubble '+d.w; e.innerHTML='<span class="av">'+d.a+'</span><span>'+d.t+'</span>'; chat.appendChild(e); if(di>=DIALOG.length){ document.getElementById('next').style.display='none'; document.getElementById('start').style.display='inline-block'; } }
  line(); var au=null; if(!reduce){ au=setInterval(function(){ if(di<DIALOG.length)line(); else clearInterval(au); },2200); } else { while(di<DIALOG.length)line(); }
  document.getElementById('next').onclick=function(){ if(au)clearInterval(au); line(); };
  document.getElementById('start').onclick=function(){ document.getElementById('quiz').style.display='block'; document.getElementById('quiz').scrollIntoView({behavior:'smooth'}); };

  // 제15조제1항 각 호 (선택지 공통)
  var HOIST=[
    {v:'1', t:'제1호 — 정보주체의 동의를 받은 경우'},
    {v:'2', t:'제2호 — 법률에 특별한 규정이 있거나 법령상 의무 준수를 위해 불가피'},
    {v:'3', t:'제3호 — 공공기관이 법령 등 소관 업무 수행을 위해 불가피'},
    {v:'4', t:'제4호 — 정보주체와의 계약 체결·이행에 필요'},
    {v:'5', t:'제5호 — 명백히 급박한 생명·신체·재산의 이익을 위해 필요'},
    {v:'6', t:'제6호 — 처리자의 정당한 이익이 정보주체 권리보다 명백히 우선'},
    {v:'7', t:'제7호 — 공중위생 등 공공의 안전과 안녕을 위해 긴급히 필요'}
  ];
  var LAWTXT={
    '2':'<span class="h">제15조(개인정보의 수집·이용) ①2.</span>\n법률에 특별한 규정이 있거나 <span class="em">법령상 의무</span>를 준수하기 위하여 불가피한 경우',
    '3':'<span class="h">제15조 ①3.</span>\n<span class="em">공공기관</span>이 법령 등에서 정하는 <span class="em">소관 업무</span>의 수행을 위하여 불가피한 경우',
    '4':'<span class="h">제15조 ①4.</span>\n정보주체와 체결한 <span class="em">계약</span>을 이행하거나 계약을 체결하는 과정에서 정보주체의 요청에 따른 조치를 이행하기 위하여 필요한 경우',
    '5':'<span class="h">제15조 ①5.</span>\n명백히 정보주체 또는 제3자의 <span class="em">급박한 생명, 신체, 재산의 이익</span>을 위하여 필요하다고 인정되는 경우',
    '6':'<span class="h">제15조 ①6.</span>\n개인정보처리자의 <span class="em">정당한 이익</span>을 달성하기 위하여 필요한 경우로서 <span class="em">명백하게 정보주체의 권리보다 우선</span>하는 경우. 이 경우 정당한 이익과 상당한 관련이 있고 합리적인 범위를 초과하지 아니하는 경우에 한한다.',
    '7':'<span class="h">제15조 ①7.</span>\n<span class="em">공중위생 등 공공의 안전과 안녕</span>을 위하여 긴급히 필요한 경우'
  };
  // 6문제 (제2~7호)
  var PROBS=[
    { ho:'2', diff:'ha', dn:'하',
      brief:'세무부서 담당자가 「국세기본법」 등 세법에 따라 체납자 관리를 위해 납세자의 성명·주소·납세정보를 수집하려 합니다. 별도 동의는 받지 않았습니다.',
      q:'이 수집의 적법 근거는 제15조제1항 몇 호일까요?', ans:'2',
      hint:['관찰: 왜 모으나요? 「국세기본법」이라는 ‘법령’이 시켰어요.','개념: 법령이 처리를 요구·의무화하면 동의 없이 가능.','판단: ‘법령상 의무’ → 제2호.'],
      flag:'FLAG{COLLECT_LAWFUL_DUTY}',
      judge:'법률에 처리 근거가 있거나 법령상 의무(세법상 부과·징수 등)를 지키려고 꼭 필요할 때예요. “우리가 받고 싶어서”가 아니라 “법이 시켜서”가 핵심이에요.',
      bad:'근거가 된 법령·조항을 수집 항목과 1:1로 확인하세요. 법령이 요구하지 않는 항목까지 끼워 모으면 과잉수집(제16조)입니다.' },
    { ho:'4', diff:'ha', dn:'하',
      brief:'공공체육관이 수영강습 ‘이용계약’을 맺으며 이용자의 이름·연락처·결제정보를 수집합니다. 강습 안내·환불에 쓰기 위해서예요.',
      q:'이 수집의 적법 근거는 몇 호일까요?', ans:'4',
      hint:['관찰: 이용자와 ‘계약’을 맺고 그 계약을 이행하려 모아요.','개념: 계약 체결·이행에 필요한 최소 정보는 동의 없이 가능.','판단: 계약 이행 → 제4호.'],
      flag:'FLAG{COLLECT_CONTRACT}',
      judge:'계약을 맺고 이행(안내·결제·환불)하는 데 꼭 필요한 정보예요. 다만 계약과 무관한 항목(예: 종교)은 이 근거로 모을 수 없어요.',
      bad:'계약 이행에 ‘필요한 최소’를 넘으면 안 돼요. 마케팅 수신 같은 선택 항목은 별도 동의(선택)로 분리하세요.' },
    { ho:'3', diff:'jung', dn:'중',
      brief:'시청 복지과가 「○○시 복지 조례」 등 법령에 따른 소관 복지사업 대상자 선정을 위해 신청자의 소득·가구 정보를 수집합니다.',
      q:'이 수집의 적법 근거는 몇 호일까요? (제2호와 헷갈리기 쉬움)', ans:'3',
      hint:['관찰: 모으는 주체가 ‘공공기관(시청)’이고, ‘소관 업무(복지)’ 수행이에요.','개념: 공공기관이 법령상 소관 업무를 하려고 불가피하면 제3호.','판단: 공공기관 + 소관 업무 → 제3호(제2호는 일반적 법령상 의무).'],
      flag:'FLAG{COLLECT_PUBLIC_DUTY}',
      judge:'제2호는 누구에게나 적용되는 ‘법령상 의무’, 제3호는 ‘공공기관’이 ‘소관 업무’를 위해 불가피한 경우예요. 공공기관의 고유 업무 수행이면 제3호가 더 정확해요.',
      bad:'소관 업무의 근거(법령·조례)와 범위를 명확히 하고, 목적 외 활용을 막으세요. 근거 없이 ‘행정 편의’로 모으면 위법입니다.' },
    { ho:'5', diff:'jung', dn:'중',
      brief:'의식을 잃고 쓰러진 민원인을 발견한 담당자가, 보호자에게 급히 연락하기 위해 소지품의 비상연락처 정보를 확인·수집했습니다.',
      q:'이 수집의 적법 근거는 몇 호일까요?', ans:'5',
      hint:['관찰: 지금 ‘급박한’ 상황(생명·신체)이에요.','개념: 급박한 생명·신체·재산 이익을 위해 명백히 필요하면 동의 없이 가능.','판단: 급박한 이익 → 제5호.'],
      flag:'FLAG{COLLECT_VITAL}',
      judge:'동의를 받을 수 없을 만큼 ‘급박’하고, 그 사람(또는 제3자)의 생명·신체·재산 이익을 위해 ‘명백히 필요’할 때예요. 상황이 종료되면 목적 외 보관은 안 돼요.',
      bad:'긴급 상황이 끝났는데도 계속 보유하면 안 됩니다. 사용 후 지체 없이 파기하고 처리 사실을 기록하세요.' },
    { ho:'6', diff:'sang', dn:'상',
      brief:'공공기관이 상습 요금 체납 회수를 위해, 체납자의 공개된 연락 정보를 최소 범위로 수집합니다. 체납 회수라는 정당한 이익이 정보주체의 권리를 명백히 넘어서고, 상당한 관련성과 합리적 범위를 지켰습니다.',
      q:'이 수집의 적법 근거는 몇 호일까요? (요건이 가장 까다로움)', ans:'6',
      hint:['관찰: ‘정당한 이익’을 위해, ‘권리보다 명백히 우선’, ‘상당한 관련·합리적 범위’ 세 조건이 보여요.','개념: 이 세 요건을 모두 충족해야만 제6호.','판단: 정당한 이익 + 권리보다 우선 + 합리적 범위 → 제6호.'],
      flag:'FLAG{COLLECT_LEGIT_INTEREST}',
      judge:'제6호는 가장 엄격해요. ① 처리자의 정당한 이익 ② 명백하게 정보주체 권리보다 우선 ③ 상당한 관련성·합리적 범위 초과 금지 — 셋을 모두 문서로 입증해야 해요.',
      bad:'요건 충족을 입증하지 못하면 위법이에요. 균형성 검토(정당한 이익 vs 권리)를 기록으로 남기고 최소 범위만 수집하세요.' },
    { ho:'7', diff:'sang', dn:'상',
      brief:'감염병 확산 등 공중위생 위기 상황에서, 공공의 안전과 안녕을 위해 긴급히 필요한 범위로 관련자 정보를 수집합니다.',
      q:'이 수집의 적법 근거는 몇 호일까요? (2023년 신설)', ans:'7',
      hint:['관찰: ‘공중위생·공공의 안전과 안녕’, ‘긴급’이 핵심어예요.','개념: 2023년 신설된 제7호가 이 상황을 위한 근거예요.','판단: 공공의 안전·안녕 + 긴급 → 제7호.'],
      flag:'FLAG{COLLECT_PUBLIC_SAFETY}',
      judge:'2023년 개정으로 신설된 호예요. 공중위생 등 공공의 안전·안녕을 위해 ‘긴급히’ 필요한 경우로 한정되며, 상황·목적이 끝나면 축소·파기해야 해요.',
      bad:'‘긴급·공공안전’을 넓게 해석해 상시 수집하면 위법이에요. 긴급성·필요성을 기록하고 범위·기간을 최소화하세요.' }
  ];

  window.__SET={title:'개인정보 수집의 적법 근거 — 법 제15조제1항(제2~7호)',kind:'ho',options:HOIST,probs:PROBS,dialog:DIALOG};
  var tabsEl=document.getElementById('tabs'), probEl=document.getElementById('prob'), done={};
  function renderTabs(cur){
    tabsEl.innerHTML=PROBS.map(function(p,i){
      return '<button class="tab'+(i===cur?' on':'')+(done[i]?' done':'')+'" data-i="'+i+'"><b>제'+p.ho+'호</b><span class="d '+p.diff+'">'+p.dn+'</span></button>';
    }).join('');
    Array.prototype.forEach.call(tabsEl.querySelectorAll('.tab'),function(b){ b.onclick=function(){ show(+b.dataset.i); }; });
  }
  function esc(s){ return s; }
  function show(i){
    var p=PROBS[i]; renderTabs(i);
    var opts=HOIST.map(function(o){ return '<button class="opt" data-v="'+o.v+'">'+o.t+'</button>'; }).join('');
    probEl.innerHTML=
      '<div class="scenario">🗂️ <b>상황</b> — '+p.brief+'</div>'+
      '<div class="q">'+p.q+'</div>'+
      '<div class="opts" id="opts">'+opts+'</div>'+
      '<div class="hintbtns"><button class="hb" data-h="1">💡 힌트1</button><button class="hb" data-h="2">💡 힌트2</button><button class="hb" data-h="3">💡 힌트3</button></div>'+
      '<div class="hintout" id="hintout"></div>'+
      '<div class="ctl"><button class="btn p" id="submit">제출하기</button></div>'+
      '<div class="verdict" id="verdict"></div>'+
      '<div class="sol" id="sol">'+
        '<div class="blk"><h3>⚖ 근거 조문 (법제처 현행본)</h3><div class="lawbox">'+LAWTXT[p.ho]+'</div></div>'+
        '<div class="blk"><h3>🔎 판단 포인트</h3><p>'+p.judge+'</p></div>'+
        '<div class="blk org"><h3>🧱 호(號)는 이렇게 읽어요</h3><p>법 <b>제15조</b>(조) → <b>제1항</b>(항) → <b>제'+p.ho+'호</b>(호). ‘항’은 큰 묶음, ‘호’는 그 안의 개별 경우예요. 수집 근거는 반드시 <b>어느 호</b>인지까지 특정해 개인정보파일 운영근거에 적어요.</p></div>'+
        '<div class="blk red"><h3>🚨 위반 시</h3><p>'+p.bad+' 적법 근거 없이 수집하면 <b>법 제15·16조 위반</b> — 과태료 대상이고, 안전조치 소홀로 유출까지 이어지면 과징금·형사책임·징계로 확대될 수 있어요.</p></div>'+
        '<div class="blk pur"><h3>📋 수집 적법성 점검 기록 예시</h3>'+
          '<table><tr><th>구분</th><th>기록</th></tr>'+
          '<tr><td>수집 항목</td><td>상황에 필요한 최소 항목</td></tr>'+
          '<tr><td>수집 근거</td><td><b>법 제15조제1항제'+p.ho+'호</b> (+개별 법령 조항)</td></tr>'+
          '<tr><td>목적</td><td>해당 업무 수행 범위</td></tr>'+
          '<tr><td>보유기간</td><td>목적 달성 시 지체 없이 파기</td></tr>'+
          '<tr><td>점검</td><td>근거-항목 일치 여부 확인(과잉수집 차단)</td></tr></table>'+
        '</div>'+
      '</div>';
    // 상호작용
    var sel=null;
    Array.prototype.forEach.call(probEl.querySelectorAll('.opt'),function(b){ b.onclick=function(){ sel=b.dataset.v; Array.prototype.forEach.call(probEl.querySelectorAll('.opt'),function(x){x.classList.remove('sel');}); b.classList.add('sel'); }; });
    var used=0;
    Array.prototype.forEach.call(probEl.querySelectorAll('.hb'),function(b){ b.onclick=function(){ var h=+b.dataset.h; var o=probEl.querySelector('#hintout'); o.style.display='block'; o.innerHTML='<b>힌트 '+h+'</b> '+p.hint[h-1]; b.classList.add('used'); used=Math.max(used,h); }; });
    probEl.querySelector('#submit').onclick=function(){
      var v=probEl.querySelector('#verdict');
      if(sel===p.ans){ v.className='verdict good'; v.innerHTML='🏁 <span class="flag">'+p.flag+'</span> — 정답! 제'+p.ho+'호가 맞아요. 아래 해설 확인.'; probEl.querySelector('#sol').classList.add('show'); done[i]=true; renderTabs(i); }
      else if(sel===null){ v.className='verdict bad'; v.innerHTML='<b>먼저 호를 선택하세요.</b>'; }
      else { v.className='verdict bad'; v.innerHTML='<b>❌ 아직이에요.</b> 선택: 제'+sel+'호. 힌트를 단계별로 열고 상황의 핵심어(법령·계약·급박·공공 등)를 다시 보세요.'; }
    };
  }
  renderTabs(0); show(0);
  document.getElementById('theme').onclick=function(){ var r=document.documentElement; r.setAttribute('data-theme', r.getAttribute('data-theme')==='dark'?'light':'dark'); };
})();
</script>
</body>
</html>
