plugins {
    id 'com.android.application'
}
android {
    namespace 'io.github.smartslacker76.privacyportal'
    compileSdk 35
    defaultConfig {
        applicationId 'io.github.smartslacker76.privacyportal'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
