name: Build Android APK
on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Compile installable debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify APK output
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hondi-PrivacyPortal-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30


      - name: Record successful APK build and checksum
        env:
          BUILD_RUN_ID: ${{ github.run_id }}
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          BYTES=$(stat -c%s "$APK")
          printf '{"status":"built","kind":"android-debug-apk","run_id":"%s","commit":"%s","sha256":"%s","bytes":%s,"artifact":"Hondi-PrivacyPortal-Android-APK"}\n' "$BUILD_RUN_ID" "$GITHUB_SHA" "$SHA" "$BYTES" > apk-build-status.json
          git add apk-build-status.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Record verified Android debug APK build [skip ci]"
            git push
          fi
      - name: Publish latest test APK as GitHub prerelease
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG=android-debug-preview
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          cp "$APK" /tmp/Hondi-PrivacyPortal-debug.apk
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --prerelease               --title "혼디 지킴이 Android 테스트 APK"               --notes "개발자 테스트용 Debug APK입니다. 스토어 배포용이 아닙니다. 빌드마다 서명키가 달라 기존 설치 앱을 삭제해야 할 수 있습니다."
          fi
          gh release upload "$TAG" /tmp/Hondi-PrivacyPortal-debug.apk --clobber
