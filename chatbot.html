<style>
  .chat { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); height: min(62vh, 560px); overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }

  .msg.me { align-self: flex-end; flex-direction: row-reverse; }
  .msg .av { flex: 0 0 auto; width: 34px; height: 34px; border-radius: 50%; background: var(--cipher-soft); display: grid; place-items: center; }
  .msg .bubble { padding: 10px 13px; border-radius: 12px; font-size: 13.5px; line-height: 1.65; }
  .msg.bot .bubble { background: var(--surface-2); border: 1px solid var(--line); border-top-left-radius: 3px; }

  .barrow { display: flex; gap: 8px; margin-top: 12px; }

  .asof-bar { font-size: 12px; color: var(--muted); line-height: 1.65; background: var(--surface-2); border: 1px solid var(--line); border-left: 3px solid var(--cipher); border-radius: 8px; padding: 9px 12px; margin: 12px 0 0; }
  .a-chk { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
  .a-chk a { font-size: 11.5px; font-weight: 600; text-decoration: none; color: var(--cipher); border: 1px solid var(--line); border-radius: 7px; padding: 3px 9px; }

  details.qa-i > summary { cursor: pointer; font-size: 12.5px; line-height: 1.65; list-style: none; }
  details.qa-i > summary::-webkit-details-marker { display: none; }

  details.qa-i[open] > summary::before { content: '▾ '; }
  details.qa-i > summary b { color: var(--cipher); }
  .qa-a { font-size: 12.5px; line-height: 1.75; margin-top: 6px; padding-left: 14px; }
  .qa-d { font-size: 12px; line-height: 1.7; color: var(--muted); margin-top: 5px; padding-left: 14px; }
  .qa-l { font-size: 11px; color: var(--muted); margin-top: 5px; padding-left: 14px; }
  /* 첨부 가이드 인용 */

  .gd h4 { font-family: var(--f-display); font-size: 13px; margin: 0 0 4px; }

  /* 공통 출력 구조: 2줄 요약 + 토글 */

  details.dt { border: 1px solid var(--line); border-radius: 9px; background: var(--surface); }

  details.dt > summary::-webkit-details-marker { display: none; }

  .dt-in { padding: 11px 13px 13px; }

  .how3 { display: grid; gap: 7px; margin-top: 9px; }

  .chk-box { margin-top: 9px; background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; }
  .chk-h { font-size: 12.5px; font-weight: 700; color: var(--cipher); margin-bottom: 6px; }

  .sum-box { margin-top: 9px; background: var(--cipher-soft); border-left: 3px solid var(--cipher); border-radius: 7px; padding: 8px 12px; }
  .sum-box b { font-size: 11.5px; color: var(--cipher); letter-spacing: .02em; }
  .sum-box p { margin: 3px 0 0; font-size: 13px; line-height: 1.65; }
  .rv { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px; }
  .rv h4 { font-family: var(--f-display); font-size: 13.5px; margin: 0 0 6px; color: var(--cipher); }
  .rv-q { font-size: 12px; color: var(--muted); margin: 0 0 8px; }
  .rv-dl { display: grid; grid-template-columns: 104px 1fr; gap: 7px 10px; font-size: 12.5px; margin: 0; }
  .rv-dl dt { font-weight: 700; color: var(--muted); }
  .rv-dl dd { margin: 0; line-height: 1.7; }
  .rv b.ok { color: var(--ok); } .rv b.cond { color: var(--warn); } .rv b.bad { color: var(--plain); }
  .qz { border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px; margin-top: 9px; background: var(--surface); }
  .qz-q { font-size: 13px; line-height: 1.7; }
  .qz-ox { color: var(--cipher); font-weight: 700; white-space: nowrap; }
  .qz-btn { margin-top: 8px; font: inherit; font-size: 12px; font-weight: 600; padding: 5px 12px; border: 1px solid var(--cipher); background: transparent; color: var(--cipher); border-radius: 7px; cursor: pointer; }
  .qz-btn:hover { background: var(--cipher-soft); }
  .qz-a { margin-top: 9px; border-top: 1px dashed var(--line); padding-top: 8px; font-size: 12.5px; line-height: 1.7; }

  .qz-why { margin-top: 7px; }
  .qz-why b.h, .qz-law b.h, .qz-tip b.h { display: block; font-size: 11.5px; letter-spacing: .03em; color: var(--muted); margin-bottom: 3px; }
  .qz-law { margin-top: 8px; font-size: 12px; color: var(--muted); border-left: 3px solid var(--cipher); padding-left: 9px; line-height: 1.65; }
  .qz-tip { margin-top: 8px; background: var(--surface-2); border-radius: 7px; padding: 8px 10px; font-size: 12.5px; line-height: 1.7; }
  .qz-pick { display: flex; gap: 6px; margin-top: 9px; align-items: center; flex-wrap: wrap; }
  .qz-pick button.ox-b { font: inherit; font-size: 13px; font-weight: 800; width: 42px; height: 32px; border: 1px solid var(--line);
    background: var(--surface-2); color: var(--ink); border-radius: 8px; cursor: pointer; }
  .qz-pick button.ox-b:hover { border-color: var(--cipher); color: var(--cipher); }
  .qz-pick button.ox-b.sel { background:var(--pri-solid); border-color: var(--cipher); color: #fff; }
  .qz-vd { font-size: 12.5px; font-weight: 800; margin-left: 4px; }
  .qz-vd.good { color: var(--ok, #34445e); } .qz-vd.miss { color: #c2261c; }
  html[data-theme="dark"] .qz-vd.good { color: #607e94; } html[data-theme="dark"] .qz-vd.miss { color: #f87171; }
  .qz-ans { font-size: 13px; }
  @media (max-width: 640px) { .rv-dl { grid-template-columns: 1fr; } .rv-dl dt { margin-top: 5px; } }
  /* 구조화 상세 답변 */
