<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>뭐든 물어봅서 고팡 도우미 · 혼디지킴이</title>
<meta name="description" content="개인정보 보호에 관한 궁금증을 물어보면 근거 조문과 함께 답해주는 규칙 기반 챗봇입니다.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .chat { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); height: min(62vh, 560px); overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { display: flex; gap: 9px; max-width: 86%; }
  .msg.me { align-self: flex-end; flex-direction: row-reverse; }
  .msg .av { flex: 0 0 auto; width: 34px; height: 34px; border-radius: 50%; background: var(--cipher-soft); display: grid; place-items: center; }
  .msg .bubble { padding: 10px 13px; border-radius: 12px; font-size: 13.5px; line-height: 1.65; }
  .msg.bot .bubble { background: var(--surface-2); border: 1px solid var(--line); border-top-left-radius: 3px; }
  .msg.me .bubble { background: var(--cipher); color: #fff; border-top-right-radius: 3px; }
  .msg .bubble .src { display: block; margin-top: 6px; font-size: 11.5px; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; margin: 12px 0; }
  .chip-q { font-size: 12.5px; padding: 7px 11px; border: 1px solid var(--line); border-radius: 20px; background: var(--surface-2); cursor: pointer; color: var(--ink); }
  .chip-q:hover { border-color: var(--cipher); color: var(--cipher); }
  .barrow { display: flex; gap: 8px; margin-top: 12px; }
  .barrow input { flex: 1; font: inherit; font-size: 14px; padding: 11px 13px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); color: var(--ink); }
  /* 구조화 상세 답변 */
  .chat { height: min(72vh, 680px); }
  .msg { max-width: 86%; }
  .msg.bot { max-width: 95%; }
  .msg .bubble.long { max-width: none; }
  .a-title { font-family: var(--f-display); font-weight: 800; font-size: 15px; margin: 0 0 7px; padding-bottom: 6px; border-bottom: 2px solid var(--cipher); display: inline-block; }
  .a-intro { margin: 0 0 4px; }
  .a-hr, hr.a-hr { border: 0; border-top: 1px solid var(--line); margin: 11px 0 9px; }
  .a-sec h4 { font-family: var(--f-display); font-size: 13.5px; margin: 9px 0 5px; color: var(--cipher); }
  .a-sec ul { margin: 0; padding-left: 17px; }
  .a-sec li { margin: 4px 0; line-height: 1.7; }
  .a-sec li::marker { color: var(--cipher); }
  .a-rel { margin-top: 12px; padding-top: 9px; border-top: 1px dashed var(--line); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .a-rel > span { font-size: 11.5px; color: var(--muted); font-weight: 700; margin-right: 2px; }
  .a-rel .chip-q { font-size: 11.5px; padding: 4px 10px; }
  .msg .bubble .src { border-top: 1px dashed var(--line); padding-top: 6px; margin-top: 10px; }
  @media (max-width: 640px) { .msg.bot { max-width: 100%; } .chat { padding: 12px; } }
</style>
</head>
<body>
<div class="sp-wrap">
  <div class="sp-top"><a class="back" href="index.html">← 혼디지킴이 포털</a><span class="brand">뭐든 물어봅서 고팡 도우미</span></div>
  <div class="sp-head">
    <h1>뭐든 물어봅서 고팡 도우미</h1>
    <p class="lead">개인정보 보호가 궁금할 때 물어보세요. 주제를 입력하면 <b>정의 · 유형 · 법령 근거 · 공공기관 실무 · 법적 제재 · 위반 사례 · 판례</b> 순서로 자세히 답해요. <b>규칙 기반(토큰 0)</b>이라 입력은 서버로 전송되지 않고, 근거 조문을 누르면 국가법령정보센터로 연결됩니다.</p>
  </div>

  <div class="chips" id="chips"></div>
  <div class="chat" id="chat" aria-live="polite"></div>
  <form class="barrow" id="form" autocomplete="off">
    <input type="text" id="q" placeholder="예: CCTV는 며칠이나 보관해요?" aria-label="질문 입력">
    <button class="btn primary" type="submit">보내기</button>
  </form>
  <p class="notice" style="margin-top:14px">정해진 주제에 대한 교육·실무 보조 답변이에요. 구체적 사안은 개인정보보호위원회(pipc.go.kr)·전문가 검토가 필요할 수 있어요.</p>
</div>

<script src="assets/config.js"></script>
<script src="assets/js/law.js"></script>
<script src="assets/data/chatbot-kb.js"></script>
<script>
(function () {
  var KB = window.CHATKB || [];
  var chat = document.getElementById('chat');
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]; }); }

  /* 구조화 답변 렌더링: 제목 → 인트로 → 구분선 → 번호 절 → 근거 → 관련 주제 */
  function render(e) {
    var h = '';
    if (e.intro) h += '<p class="a-intro">' + e.intro + '</p>';
    if (e.sections && e.sections.length) {
      h += e.sections.map(function (sec, i) {
        return '<div class="a-sec"><h4>' + (i + 1) + '. ' + esc(sec.h) + '</h4><ul>' +
          sec.items.map(function (it) { return '<li>' + it + '</li>'; }).join('') + '</ul></div>';
      }).join('<hr class="a-hr">');
    }
    if (e.tableHtml) h += e.tableHtml;
    if (e.related && e.related.length) {
      var names = e.related.map(function (id) {
        var t = KB.filter(function (x) { return x.id === id; })[0];
        return t ? '<button type="button" class="chip-q rel" data-q="' + esc(t.kw[0]) + '">' + esc(t.title) + '</button>' : '';
      }).filter(Boolean).join('');
      if (names) h += '<div class="a-rel"><span>이어서 볼 주제</span>' + names + '</div>';
    }
    return h;
  }

  function add(role, html, src, title) {
    var m = document.createElement('div');
    m.className = 'msg ' + role;
    var av = role === 'bot' ? '<div class="av">🧑🏻‍🦱</div>' : '<div class="av">🙋</div>';
    m.innerHTML = av + '<div class="bubble' + (role === 'bot' && title ? ' long' : '') + '">' +
      (title ? '<div class="a-title">' + esc(title) + '</div>' : '') + html +
      (src ? '<span class="src law-cite">근거: ' + esc(src) + '</span>' : '') + '</div>';
    chat.appendChild(m);
    chat.scrollTop = chat.scrollHeight;
    if (role === 'bot' && window.PI && window.PI.linkifyLaws) window.PI.linkifyLaws(m);
  }

  /* 키워드 매칭: 긴 키워드 우선, need 조건 충족 필수 */
  function match(q) {
    var s = q.toLowerCase().replace(/\s/g, '');
    var best = null, bestScore = 0;
    KB.forEach(function (e) {
      if (e.need && !e.need.some(function (n) { return s.indexOf(n.replace(/\s/g, '')) >= 0; })) return;
      var sc = 0;
      e.kw.forEach(function (k) {
        var kk = k.toLowerCase().replace(/\s/g, '');
        if (s.indexOf(kk) >= 0) sc = Math.max(sc, kk.length);   // 긴 키워드일수록 정확한 매칭
      });
      if (sc > bestScore) { bestScore = sc; best = e; }
    });
    return bestScore > 0 ? best : null;
  }

  function answer(q) {
    var e = match(q);
    if (e) return add('bot', render(e), e.src, e.title);
    var topics = KB.map(function (x) { return '<button type="button" class="chip-q rel" data-q="' + esc(x.kw[0]) + '">' + esc(x.title) + '</button>'; }).join('');
    add('bot', '<p class="a-intro">아직 제가 아는 주제가 아니에요. 아래 주제 중에서 골라 보시겠어요?</p><div class="a-rel"><span>다룰 수 있는 주제</span>' + topics + '</div>' +
      '<p style="margin:10px 0 0;font-size:12.5px;color:var(--muted)">더 자세한 실습은 <a href="learn.html" style="color:var(--cipher)">함께 배우는 개인정보 보호</a>와 <a href="ctf.html" style="color:var(--cipher)">CTF로 배우는 개인정보 보호</a>에서 확인할 수 있어요.</p>');
  }

  var QS = ['민감정보', '주민등록번호는 어떻게 저장해요?', '접속기록은 몇 년 보관해요?', '암호화 대상이 뭐예요?',
            'CCTV는 며칠 보관해요?', '유출되면 언제까지 신고해요?', '영향평가는 누가 받아요?', '위탁과 제3자 제공 차이',
            '목적 외 이용', '공무원 징계'];
  var chips = document.getElementById('chips');
  chips.innerHTML = QS.map(function (q) { return '<button type="button" class="chip-q">' + esc(q) + '</button>'; }).join('');

  function ask(text) { add('me', esc(text)); setTimeout(function () { answer(text); }, 160); }
  chips.addEventListener('click', function (ev) { var b = ev.target.closest('.chip-q'); if (b) ask(b.dataset.q || b.textContent); });
  chat.addEventListener('click', function (ev) { var b = ev.target.closest('.chip-q'); if (b) ask(b.dataset.q || b.textContent); });
  document.getElementById('form').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var inp = document.getElementById('q'), v = inp.value.trim();
    if (!v) return; inp.value = ''; ask(v);
  });

  add('bot', '<p class="a-intro">안녕! 난 <b>요망진 간세다리</b>예요. 개인정보 보호가 궁금하면 뭐든 물어봅서. 주제를 입력하면 <b>정의 · 유형 · 법령 근거 · 공공기관 실무 · 법적 제재 · 위반 사례 · 판례</b> 순서로 자세히 알려드려요.</p>');
})();
</script>
</body>
</html>
